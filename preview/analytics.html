</style><body><main><div class="panel"><b>Prévia demonstrativa · dados fictícios</b><p>Sem conexão com o banco. Nenhum dado real é exibido ou alterado. Selecione novembro de 2026 para explorar o exemplo.</p></div><section id="analytics" class="view active"><div class="panel"><div class="row between"><h2>Dashboard analítico</h2><button id="demoPrivacy" class="secondary">Ocultar valores</button></div><p class="muted">Análise por mês de referência dos lançamentos cadastrados. Salários fixos não são somados novamente às receitas.</p><div class="analytics-filters"><div class="field"><label for="analyticsMonth">Mês de referência</label><input id="analyticsMonth" type="month"></div><div class="field"><label for="analyticsCategory">Categoria</label><select id="analyticsCategory"><option value="">Todas as categorias</option></select></div><div class="field"><label for="analyticsPeriod">Histórico até o mês selecionado</label><select id="analyticsPeriod"><option value="6">6 meses</option><option value="12">12 meses</option></select></div></div><div id="analyticsContent" aria-live="polite"></div></div></section>
</main><script>/* Pure calculations; amounts use integer cents. No database writes. */
(function(root){
 const cents=value=>Math.round(Number(value)*100)||0;
 const shift=(month,offset)=>{const [y,m]=month.slice(0,7).split('-').map(Number);const d=new Date(y,m-1+offset,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
 function summarize(entries,{month,category='',months=6,today}){
  const eligible=entries.filter(e=>!category||e.category_id===category);
  function totals(key){const rows=eligible.filter(e=>e.month_ref.slice(0,7)===key);const sum=predicate=>rows.filter(predicate).reduce((n,e)=>n+cents(e.amount),0);const income=sum(e=>e.entry_type==='income'),expense=sum(e=>e.entry_type==='expense'),reserve=sum(e=>e.entry_type==='reserve');return {month:key,count:rows.length,income,expense,reserve,balance:income-expense-reserve,received:sum(e=>e.entry_type==='income'&&e.status==='paid'),paid:sum(e=>e.entry_type==='expense'&&e.status==='paid'),pending:sum(e=>e.entry_type==='expense'&&e.status==='pending'),overdue:sum(e=>e.entry_type==='expense'&&e.status==='pending'&&e.due_date<today),installments:sum(e=>e.entry_type==='expense'&&e.recurrence_type==='installments')};}
  const current=totals(month),previous=totals(shift(month,-1)),groups=new Map();
  eligible.filter(e=>e.month_ref.slice(0,7)===month&&e.entry_type==='expense').forEach(e=>groups.set(e.category_id,(groups.get(e.category_id)||0)+cents(e.amount)));
  return {current,previous,variation:previous.expense?(current.expense-previous.expense)/previous.expense*100:null,commitment:current.income?current.installments/current.income*100:null,groups:[...groups].map(([id,value])=>({id,value})).sort((a,b)=>b.value-a.value),trend:Array.from({length:months},(_,i)=>totals(shift(month,i-months+1)))};
 }
 root.FinanceAnalytics={summarize,shift};
})(typeof window==='undefined'?globalThis:window);

const $=id=>document.getElementById(id);const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const firstDay=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';const monthName=s=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});const month=new Date(2026,10,1);const categories=[{id:'home',name:'Moradia'},{id:'food',name:'Alimentação'},{id:'income',name:'Receitas'}];const entries=[{amount:5000,entry_type:'income',status:'paid',category_id:'income',month_ref:'2026-11-01',due_date:'2026-11-05'},{amount:1500,entry_type:'expense',status:'pending',category_id:'home',month_ref:'2026-11-01',due_date:'2026-11-01'},{amount:600,entry_type:'expense',status:'paid',category_id:'food',month_ref:'2026-11-01',due_date:'2026-11-03'},{amount:1400,entry_type:'expense',status:'paid',category_id:'home',month_ref:'2026-10-01',due_date:'2026-10-01'}];
function renderAnalytics(){
 const select=$('analyticsCategory'),chosen=select.value;
 select.innerHTML='<option value="">Todas as categorias</option>'+categories.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('');select.value=chosen;
 const selected=$('analyticsMonth').value||firstDay(month).slice(0,7),now=new Date(),today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
 const data=FinanceAnalytics.summarize(entries,{month:selected,category:select.value,months:Number($('analyticsPeriod').value),today}),c=data.current,hidden=document.body.classList.contains('values-hidden'),fmt=n=>hidden?'••••••':money(n/100),percent=n=>hidden?'••••':n===null?'Sem base de comparação':n.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
 const cards=[['Receitas lançadas',c.income],['Despesas lançadas',c.expense],['Reservas',c.reserve],['Saldo após reservas',c.balance],['Receitas recebidas',c.received],['Despesas pagas',c.paid],['Despesas pendentes',c.pending],['Despesas vencidas',c.overdue]];
 const max=Math.max(1,...data.trend.flatMap(t=>[t.income,t.expense]));
 $('analyticsContent').innerHTML='<div class="analytics-grid">'+cards.map(([label,value])=>'<div class="analytics-card"><span>'+label+'</span><strong>'+fmt(value)+'</strong></div>').join('')+'</div><p>'+c.count+' lançamentos no período. Variação das despesas sobre o mês anterior: '+percent(data.variation)+'. Parcelas / receitas lançadas: '+percent(data.commitment)+'.</p><p class="muted">Saldo = receitas − despesas − reservas, incluindo pendências. Vencidas são despesas pendentes com vencimento anterior a hoje.</p><h3>Evolução mensal</h3><p class="muted">Receitas em cor principal · despesas em cinza. Meses sem registros aparecem zerados; valores futuros são lançamentos, não previsão de renda.</p>'+data.trend.map(t=>'<div class="analytics-row"><span>'+esc(monthName(t.month+'-01'))+'</span><div>'+(!hidden?'<div class="analytics-bar" style="width:'+t.income/max*100+'%"></div><div class="analytics-bar" style="background:#7b8690;margin-top:5px;width:'+t.expense/max*100+'%"></div>':'••••')+'</div><span>'+fmt(t.income)+'<br>'+fmt(t.expense)+'</span></div>').join('')+'<h3>Despesas por categoria</h3>'+ (data.groups.map(g=>'<div class="analytics-row"><span>'+esc(categories.find(x=>x.id===g.id)?.name||'Sem categoria')+'</span><div>'+(!hidden?'<div class="analytics-bar" style="width:'+g.value/Math.max(1,c.expense)*100+'%"></div>':'••••')+'</div><span>'+fmt(g.value)+'</span></div>').join('')||'<p class="muted">Nenhuma despesa no filtro selecionado.</p>')+'<h3>Detalhamento mensal</h3><div class="analytics-scroll"><table class="analytics-table"><caption>Valores por mês de referência</caption><thead><tr><th scope="col">Mês</th><th scope="col">Receitas</th><th scope="col">Despesas</th><th scope="col">Reservas</th><th scope="col">Saldo</th></tr></thead><tbody>'+data.trend.map(t=>'<tr><th scope="row">'+esc(monthName(t.month+'-01'))+'</th><td>'+fmt(t.income)+'</td><td>'+fmt(t.expense)+'</td><td>'+fmt(t.reserve)+'</td><td>'+fmt(t.balance)+'</td></tr>').join('')+'</tbody></table></div>';
}
